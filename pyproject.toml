[project]
name = "webnovel-audio"
version = "0.1.0"
description = "Offline high-quality TTS for web novels, CPU-first (tuned for Ryzen 8745HS / Radeon 780M, no CUDA)"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Baseline narration engine. Installs onnxruntime (CPU, uses AVX-512/VNNI on Zen 4).
kokoro = [
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.18",
]

[project.scripts]
webnovel-audio = "webnovel_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webnovel_audio"]

[dependency-groups]
dev = ["pytest>=8"]
