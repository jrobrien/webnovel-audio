[project]
name = "webnovel-audio"
version = "0.4.0"
description = "Offline high-quality TTS for web novels, CPU-first (tuned for Ryzen 8745HS / Radeon 780M, no CUDA)"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    # The POS tagger, which rendering refuses to run without: the pronunciation
    # rules are keyed on part of speech, and with no tagger espeak decides
    # heteronyms itself and gets them wrong. The `sm` model is the default
    # because the accuracy difference on this workload is small and `md` is
    # ~40x the download; `webnovel-audio tagger install --model en_core_web_md`
    # upgrades in place. The model is not on PyPI (a GitHub release wheel), so
    # it is named by URL.
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Baseline narration engine (onnxruntime runs on CPU, using AVX-512/VNNI on
# Zen 4). Optional so that fetching, parsing and serving work without a TTS
# runtime; the POS tagger is a regular dependency because rendering needs it.
kokoro = [
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.18",
]

[project.scripts]
webnovel-audio = "webnovel_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The spaCy model is a GitHub release wheel, not a PyPI package, so the
# dependencies name it by URL. Hatchling rejects direct references unless
# told they are intentional — they are: there is nowhere else to get it.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/webnovel_audio"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Prefer the distribution's Python over a uv-downloaded one.
#
# Not a version preference — a *build* preference. uv's managed interpreters
# come from python-build-standalone, whose Linux Tk is compiled without Xft:
# it sees one font family and draws every string in the X11 `fixed` bitmap
# font, which has no apostrophe, curly quote, em dash or ellipsis. That makes
# the control UI's Markdown pane unreadable for prose, and nothing can be
# configured to fix it — _tkinter is built against one Tk at interpreter build
# time. A distro Python links the system Tk and renders correctly.
#
# "system" rather than "only-system" so a machine without a suitable system
# Python still resolves; `ui` detects such an interpreter and says so. This
# costs nothing on Windows, where Tk uses native font APIs either way.
python-preference = "system"
