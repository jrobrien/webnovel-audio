[project]
name = "webnovel-audio"
version = "0.4.0"
description = "Offline high-quality TTS for web novels, CPU-first (tuned for Ryzen 8745HS / Radeon 780M, no CUDA)"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Baseline narration engine. Installs onnxruntime (CPU, uses AVX-512/VNNI on Zen 4).
kokoro = [
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.18",
]

# Optional POS tagger for heteronyms (`read` past vs present, CON-tent vs
# con-TENT). Without it espeak decides and nothing else changes; see
# docs/plans/heteronym-disambiguation.md. `tagger install` does this for you
# and also fetches the model, which is not a PyPI package.
spacy = [
    "spacy>=3.8",
]

[project.scripts]
webnovel-audio = "webnovel_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webnovel_audio"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Prefer the distribution's Python over a uv-downloaded one.
#
# Not a version preference — a *build* preference. uv's managed interpreters
# come from python-build-standalone, whose Linux Tk is compiled without Xft:
# it sees one font family and draws every string in the X11 `fixed` bitmap
# font, which has no apostrophe, curly quote, em dash or ellipsis. That makes
# the control UI's Markdown pane unreadable for prose, and nothing can be
# configured to fix it — _tkinter is built against one Tk at interpreter build
# time. A distro Python links the system Tk and renders correctly.
#
# "system" rather than "only-system" so a machine without a suitable system
# Python still resolves; `ui` detects such an interpreter and says so. This
# costs nothing on Windows, where Tk uses native font APIs either way.
python-preference = "system"
